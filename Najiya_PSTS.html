<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website header</title>
       <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

<header class="relative bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-900 text-white overflow-hidden">
  <!-- Decorative background shapes for a modern look -->
  <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
  <div class="absolute -top-24 -left-20 w-96 h-96 bg-blue-500 rounded-full blur-3xl opacity-20 animate-pulse"></div>
  <div class="absolute -bottom-24 -right-20 w-96 h-96 bg-purple-500 rounded-full blur-3xl opacity-20"></div>

  <div class="relative max-w-7xl mx-auto px-6 py-16 sm:py-24 lg:px-8 text-center flex flex-col items-center">
    
    <!-- School / Event Organizers Badge -->
    <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider uppercase bg-white/10 text-blue-200 border border-white/10 backdrop-blur-md shadow-sm mb-6 animate-fade-in">
      Al-Abidin Billigual Boarding School
    </span>

    <!-- Main Page Title -->
    <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-blue-100 to-indigo-200 drop-shadow-sm max-w-3xl">
      Student Creativity Festival
    </h1>

    <!-- Short Description -->
    <p class="mt-6 text-base sm:text-lg md:text-xl text-indigo-200 max-w-2xl font-light leading-relaxed">
      Showcase your creativity, skills, and innovative ideas.</p>

  </div>
  
  <!-- Sleek bottom divider line -->
  <div class="h-1 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></div>
</header>

<div>
    <!-- Student's Name -->
      <div>
        <label for="studentName" class="block text-sm font-medium text-slate-700 mb-1">student's Name</label>
        <input type="text" id="studentName" name="studentName" placeholder="Enter Your Full name"
          class="w-full rounded-md border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
</div>

 <div>
    <!-- Class -->
      <div>
        <span class="block text-sm font-medium text-slate-700 mb-2">Class</span>
        <div class="flex flex-wrap gap-x-6 gap-y-2">
          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="radio" name="Class" value="X" class="text-sky-600 focus:ring-sky-500">
            X
          </label>
          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="radio" name="Class" value="XI" class="text-sky-600 focus:ring-sky-500">
            XI
          </label>
          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="radio" name="Class" value="XII" class="text-sky-600 focus:ring-sky-500">
            XII
          </label>
 </div>

    <!-- Gender -->
    <div>
       <input type="radio" name="gender" required>Male
       <input type="radio" name="gender" required>Female<br>
    </div>

    <!-- Competition Category --><br>
        <input type="checkbox" name="Competition Category" value="Web Development">Web Development
        <input type="checkbox" name="Competition Category" value="IoT Project">IoT project
        <input type="checkbox" name="Competition Category" value="Graphic Design">JavaScript
        <input type="checkbox" name="Competition Category" value="Public Speaking">Public Speaking
        <input type="checkbox" name="Competition Category" value="Photography">Photography<br>

       <!-- Participation Type --><br>
        <input type="radio" name="Participation Type" required>Individual
        <input type="radio" name="Participation Type" required>Team<br>

         <!-- Team Name --><br>
       <input type="text" name="name" value="" placeholder="Enter Your Team Name" required maxlength="50"><br>

         <!-- Contact Number --><br>
       <input type="text" name="name" value="" placeholder="08xxxxxxxx" required maxlength="50"><br>

         <!-- Project Description --><br>
       <textarea rows="5" cols="40" placeholder="Describe your project or competition entry..." required></textarea><br>

         <button type="Registration Button">Register Now</button>

</body>
</html>
