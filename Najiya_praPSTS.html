<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Comuter Lab Reservation</title>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">
    
    <header class="bg-slate-900 text-white">
    <div class="max-w-3xl mx-auto px-6 py-8">
      <p class="text-sky-400 text-sm font-semibold tracking-wide">SCHOOL COMPUTER LAB</p>
      <h1 class="text-3xl md:text-4xl font-bold mt-1">Lab Reservation Form</h1>
      <p class="text-slate-300 mt-2 max-w-xl">Book Lab 1 or Lab 2 for use outside regular class hours. Fill in the details below and submit at least one day in advance.</p>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-10">
    <form class="bg-white rounded-lg shadow-sm border border-slate-200 p-6 md:p-10 space-y-8">

      <!-- Borrower's Name -->
      <div>
        <label for="borrowerName" class="block text-sm font-medium text-slate-700 mb-1">Borrower's Name</label>
        <input type="text" id="borrowerName" name="borrowerName" placeholder="Full name"
          class="w-full rounded-md border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
      </div>

      <!-- Status -->
      <div>
        <span class="block text-sm font-medium text-slate-700 mb-2">Status</span>
        <div class="flex flex-wrap gap-x-6 gap-y-2">
          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="radio" name="status" value="Teacher" class="text-sky-600 focus:ring-sky-500">
            Teacher
          </label>
          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="radio" name="status" value="Student" class="text-sky-600 focus:ring-sky-500">
            Student
          </label>
          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="radio" name="status" value="Organization" class="text-sky-600 focus:ring-sky-500">
            Organization
          </label>
        </div>
      </div>

      <!-- Purpose -->
      <div>
        <label for="purpose" class="block text-sm font-medium text-slate-700 mb-1">Purpose</label>
        <input type="text" id="purpose" name="purpose" placeholder="Practicum, Practice, OSIS Meeting, etc."
          class="w-full rounded-md border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 placeholder:italic">
      </div>

      <!-- Borrowed Lab -->
      <div>
        <span class="block text-sm font-medium text-slate-700 mb-2">Borrowed Lab</span>
        <div class="flex flex-wrap gap-x-6 gap-y-2">
          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="radio" name="lab" value="Lab 1 (Software)" class="text-sky-600 focus:ring-sky-500">
            Lab 1 (Software)
          </label>
          <label class="flex items-center gap-2 text-sm text-slate-700">
            <input type="radio" name="lab" value="Lab 2 (Hardware)" class="text-sky-600 focus:ring-sky-500">
            Lab 2 (Hardware)
          </label>
        </div>
      </div>

      <!-- Date of Use -->
      <div>
        <label for="dateOfUse" class="block text-sm font-medium text-slate-700 mb-1">Date of Use</label>
        <input type="date" id="dateOfUse" name="dateOfUse"
          class="w-full md:w-1/2 rounded-md border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
      </div>

      <!-- Start / End Time -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="startTime" class="block text-sm font-medium text-slate-700 mb-1">Start Time</label>
          <input type="time" id="startTime" name="startTime"
            class="w-full rounded-md border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
        </div>
        <div>
          <label for="endTime" class="block text-sm font-medium text-slate-700 mb-1">End Time</label>
          <input type="time" id="endTime" name="endTime"
            class="w-full rounded-md border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
        </div>
      </div>

      <!-- Number of Participants -->
      <div>
        <label for="participants" class="block text-sm font-medium text-slate-700 mb-1">Number of Participants</label>
        <input type="number" id="participants" name="participants" min="1" placeholder="e.g. 20"
          class="w-full md:w-1/2 rounded-md border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500">
      </div>

      <!-- Special Requirements -->
      <div>
        <label for="specialReq" class="block text-sm font-medium text-slate-700 mb-1">Special Requirements</label>
        <textarea id="specialReq" name="specialReq" rows="4" placeholder="Need internet access, need a projector, etc."
          class="w-full rounded-md border border-slate-300 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 placeholder:italic"></textarea>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button type="submit"
          class="w-full md:w-auto bg-sky-600 hover:bg-sky-700 text-white font-semibold px-8 py-3 rounded-md transition-colors duration-200">
          Submit Reservation
        </button>
      </div>

    </form>

    <p class="text-center text-sm text-slate-500 mt-6">Reservations are subject to lab availability and staff confirmation.</p>
  </main>

</body>
</html>
